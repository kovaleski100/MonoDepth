[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-depth"
version = "0.1.0"
description = "PixelSeg UND backbone with DA3 depth decoding and multiview attention"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy", "einops>=0.7", "addict"]

[project.optional-dependencies]
comparison = ["h5py>=3", "scipy>=1.10", "pillow>=9"]

[project.scripts]
pixel-depth = "pixel_depth.cli:main"
pixel-depth-compare = "pixel_depth.compare:main"

[tool.setuptools.packages.find]
include = ["pixel_depth*"]
