<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="930"
viewBox="0 0 1500 930">
<title>PixelDepth — arquitetura simplificada</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#49627f"/>
  </marker>
  <style>
    .title { font: 700 18px sans-serif; fill: #172b4d; }
    .body { font: 14px sans-serif; fill: #29415f; }
    .label { font: 12px sans-serif; fill: #49627f; text-anchor: middle; }
    .section { font: 700 20px sans-serif; fill: #172b4d; }
    .note { font: 13px sans-serif; fill: #49627f; }
    .arrow { fill: none; stroke: #49627f; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
</defs>
<rect width="100%" height="100%" fill="#fbfcfe"/>
<text x="40" y="48" class="section">PixelDepth — arquitetura simplificada</text>
<text x="40" y="74" class="note">Gerado a partir da configuração ativa; blocos internos estão resumidos.</text>

<rect x="40" y="250" width="190" height="150" rx="14" fill="#e9f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="56" y="279" class="title">Entrada</text>
<text x="56" y="308" class="body">images: [B, S, C, H, W]</text>
<text x="56" y="330" class="body">C = 3 canais</text>
<text x="56" y="352" class="body">várias vistas opcionais</text>
<rect x="285" y="250" width="205" height="150" rx="14" fill="#eef4ff" stroke="#315b9b" stroke-width="2"/>
<text x="301" y="279" class="title">Patch embedding</text>
<text x="301" y="308" class="body">patch = 16 × 16</text>
<text x="301" y="330" class="body">hidden = 384</text>
<text x="301" y="352" class="body">tokens + camera tokens</text>
<rect x="545" y="170" width="340" height="310" rx="14" fill="#f0edff" stroke="#7654a6" stroke-width="2"/>
<text x="561" y="199" class="title">Backbone PixelSeg / DA3</text>
<text x="561" y="228" class="body">12 blocos; local + global a partir de 4</text>
<text x="561" y="250" class="body">GQA: 8 heads / 4 KV</text>
<text x="561" y="272" class="body">features exportadas: [5, 7, 9, 11]</text>
<text x="561" y="294" class="body">blocos locais preservam cada vista</text>
<text x="561" y="316" class="body">blocos globais misturam as vistas</text>
<text x="561" y="338" class="body">RMSNorm + RoPE espacial</text>
<rect x="950" y="135" width="260" height="350" rx="14" fill="#fff5e6" stroke="#bd741c" stroke-width="2"/>
<text x="966" y="164" class="title">DualDPT</text>
<text x="966" y="193" class="body">projeção + fusão multiescala</text>
<text x="966" y="215" class="body">duas branches independentes</text>
<text x="966" y="237" class="body">decoder de alta resolução</text>
<text x="966" y="259" class="body">ray branch: habilitado</text>
<rect x="1280" y="125" width="180" height="105" rx="14" fill="#e8f4ff" stroke="#2471a3" stroke-width="2"/>
<text x="1296" y="154" class="title">Depth</text>
<text x="1296" y="183" class="body">profundidade positiva</text>
<text x="1296" y="205" class="body">depth + ray confidence</text>
<rect x="1280" y="265" width="180" height="105" rx="14" fill="#e8f4ff" stroke="#2471a3" stroke-width="2"/>
<text x="1296" y="294" class="title">Ray map</text>
<text x="1296" y="323" class="body">origem + direção</text>
<text x="1296" y="345" class="body">6 canais por pixel</text>
<rect x="1280" y="405" width="180" height="105" rx="14" fill="#fcecef" stroke="#a23b52" stroke-width="2"/>
<text x="1296" y="434" class="title">Câmera</text>
<text x="1296" y="463" class="body">decoder: habilitado</text>
<text x="1296" y="485" class="body">extrinsics + intrinsics</text>
<rect x="285" y="590" width="205" height="125" rx="14" fill="#fff8e8" stroke="#b7791f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="301" y="619" class="title">Câmeras conhecidas</text>
<text x="301" y="648" class="body">extrinsics + intrinsics</text>
<text x="301" y="670" class="body">pose encoding → token</text>
<text x="301" y="692" class="body">condicionamento opcional</text>
<rect x="545" y="590" width="340" height="125" rx="14" fill="#f2f4f7" stroke="#687385" stroke-width="2" stroke-dasharray="8 6"/>
<text x="561" y="619" class="title">Supervisão no treino</text>
<text x="561" y="648" class="body">depth loss + confidence</text>
<text x="561" y="670" class="body">ray loss + teacher depth</text>
<text x="561" y="692" class="body">camera loss quando há poses</text>
<rect x="950" y="590" width="260" height="125" rx="14" fill="#e9f7ef" stroke="#2f855a" stroke-width="2"/>
<text x="966" y="619" class="title">Saídas do modelo</text>
<text x="966" y="648" class="body">depth / depth_conf</text>
<text x="966" y="670" class="body">ray / ray_conf</text>
<text x="966" y="692" class="body">pose_encoding e câmeras</text>
<path d="M 230 325 L 285 325" class="arrow"/>
<path d="M 490 325 L 545 325" class="arrow"/>
<path d="M 885 325 L 950 300" class="arrow"/>
<path d="M 1210 230 L 1280 178" class="arrow"/>
<path d="M 1210 310 L 1280 318" class="arrow"/>
<path d="M 1210 400 L 1280 458" class="arrow"/>
<path d="M 385 590 L 385 400" class="arrow" stroke-dasharray="8 6"/>
<text x="385.0" y="487.0" class="label">se fornecidas</text>
<path d="M 715 590 L 715 480" class="arrow" stroke-dasharray="8 6"/>
<text x="715.0" y="527.0" class="label">targets</text>
<path d="M 1080 485 L 1080 590" class="arrow" stroke-dasharray="8 6"/>
<text x="40" y="855" class="note">Linhas tracejadas = caminho opcional de condicionamento/supervisão.</text>
<text x="40" y="878" class="note">Treino full-da3 usa depth + ray + teacher; camera loss depende de poses no dataset.</text>
</svg>